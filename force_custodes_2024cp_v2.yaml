# Custodes 2024 Combat Patrol — v2 schema (full abilities).
#
# Sources (Wahapedia 11th ed, accessed 2026-11-18):
#   - Blade Champion:        https://wahapedia.ru/wh40k11ed/factions/adeptus-custodes/blade-champion
#   - Allarus Custodians:    https://wahapedia.ru/wh40k11ed/factions/adeptus-custodes/allarus-custodians
#   - Custodian Guard:       https://wahapedia.ru/wh40k11ed/factions/adeptus-custodes/custodian-guard
#   - Shield Host detachment:https://wahapedia.ru/wh40k11ed/factions/adeptus-custodes/
#
# Composition: 1 Blade Champion attached to the Custodian Guard, 3 Allarus
# Custodians (reserves via Deep Strike per datasheet), 5 Custodian Guard.
name: "Custodes 2024 CP"
faction: ADEPTUS_CUSTODES
detachment: shield_host
cp: 4

units:
  - name: "Blade Champion"
    models: 1
    M: 6
    T: 6
    W: 6
    Sv: 2
    InvSv: 4
    Ld: 6
    OC: 1
    keywords: [INFANTRY, CHARACTER, ADEPTUS_CUSTODES, BLADE_CHAMPION]
    abilities:
      - FIGHTS_FIRST
      - LEADER
    leader: "Custodian Guard"
    weapons:
      - name: "Vaultswords"
        A: 6
        WS: 2
        S: 7
        AP: 3
        D: 2
        melee: true
        abilities:
          - PRECISION
          - {id: SUSTAINED_HITS, n: 1}

  - name: "Allarus Custodians"
    models: 3
    M: 5
    T: 6
    W: 4
    Sv: 2
    InvSv: 4
    Ld: 6
    OC: 2
    keywords: [INFANTRY, TERMINATOR, ADEPTUS_CUSTODES, ALLARUS_CUSTODIANS]
    abilities:
      - DEEP_STRIKE
    weapons:
      - name: "Castellan axe (melee)"
        # Tune (combined): A 4->3, PRECISION removed (CHARACTER-only in 10e).
        A: 3
        WS: 2
        S: 7
        AP: 2
        D: 2
        melee: true
      - name: "Balistus grenade launcher"
        A: 1
        BS: 2
        S: 4
        AP: 0
        D: 1
        range: 18
        abilities:
          - BLAST

  - name: "Custodian Guard"
    models: 5
    M: 6
    T: 6
    W: 3
    Sv: 2
    InvSv: 4
    Ld: 6
    OC: 2
    keywords: [INFANTRY, ADEPTUS_CUSTODES, CUSTODIAN_GUARD]
    weapons:
      - name: "Guardian spear (melee)"
        A: 4
        WS: 2
        S: 7
        AP: 2
        D: 2
        melee: true
      - name: "Guardian spear (ranged)"
        A: 2
        BS: 2
        S: 4
        AP: 1
        D: 1
        range: 24
        abilities:
          - {id: RAPID_FIRE, n: 2}
