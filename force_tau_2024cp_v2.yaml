# T'au Empire 2024 Combat Patrol — v2 schema (full abilities).
#
# Sources (Wahapedia 11th ed, accessed 2026-11-18):
#   - Commander Enforcer:  https://wahapedia.ru/wh40k11ed/factions/tau-empire/commander-in-enforcer-battlesuit
#   - Breacher Team:       https://wahapedia.ru/wh40k11ed/factions/tau-empire/breacher-team
#   - Pathfinders:         https://wahapedia.ru/wh40k11ed/factions/tau-empire/pathfinders
#   - Devilfish:           https://wahapedia.ru/wh40k11ed/factions/tau-empire/devilfish
#   - Mont'ka detachment:  https://wahapedia.ru/wh40k11ed/factions/tau-empire/
#
# Note: Breacher close-range S6 AP-2 D1 profile selected (expected in CP table
# since forces start ~24" apart and move toward center quickly).
name: "T'au Empire 2024 CP"
faction: TAU_EMPIRE
detachment: montka
cp: 4

units:
  - name: "Commander in Enforcer Battlesuit"
    models: 1
    M: 10
    T: 6
    W: 7
    Sv: 2
    InvSv: 4
    Ld: 6
    OC: 1
    keywords: [BATTLESUIT, CHARACTER, COMMANDER, FLY, TAU_EMPIRE, JUMP_PACK]
    abilities:
      - FOR_THE_GREATER_GOOD
    weapons:
      - name: "Cyclic ion blaster"
        A: 4
        BS: 3
        S: 6
        AP: 1
        D: 2
        range: 18
        abilities:
          - HAZARDOUS
      - name: "Battlesuit fist"
        A: 3
        WS: 4
        S: 6
        AP: 0
        D: 1
        melee: true

  - name: "Fire Warriors Breacher Team"
    models: 10
    M: 6
    T: 3
    W: 1
    Sv: 4
    Ld: 7
    OC: 2
    keywords: [INFANTRY, FIRE_WARRIORS, TAU_EMPIRE, GRENADES]
    abilities:
      - FOR_THE_GREATER_GOOD
    weapons:
      - name: "Pulse blaster (close)"
        A: 2
        BS: 4
        S: 6
        AP: 2
        D: 1
        range: 10

  - name: "Pathfinders"
    models: 10
    M: 7
    T: 3
    W: 1
    Sv: 5
    Ld: 7
    OC: 2
    keywords: [INFANTRY, PATHFINDERS, TAU_EMPIRE, GRENADES]
    abilities:
      - FOR_THE_GREATER_GOOD
      - {id: MARKERLIGHT, n: 1}
      - {id: SCOUTS, n: 6}
    weapons:
      - name: "Pulse carbine"
        A: 2
        BS: 4
        S: 5
        AP: 0
        D: 1
        range: 24
        abilities:
          - {id: RAPID_FIRE, n: 1}

  - name: "Devilfish"
    models: 1
    M: 12
    T: 9
    W: 11
    Sv: 3
    Ld: 7
    OC: 3
    keywords: [VEHICLE, DEVILFISH, FLY, TAU_EMPIRE]
    abilities:
      - FOR_THE_GREATER_GOOD
      - {id: DEADLY_DEMISE, n: 1, threshold: 4}
    weapons:
      - name: "Burst cannon + seekers (aggregated)"
        A: 6
        BS: 4
        S: 6
        AP: 1
        D: 1
        range: 36
        abilities:
          - {id: SUSTAINED_HITS, n: 1}

  # Tune: Broadside Battlesuit added as Tau's anti-elite answer.
  #
  # The stock 2024 CP box has NO weapon that can meaningfully wound T6 2+/4++
  # Custodes - pulse blasters S6 AP-2 against a 4++ invuln is 1/12 damage
  # per shot. One Broadside with twin heavy rail rifles (S9 AP-4 D3 TWIN_LINKED)
  # gives Tau the 3-damage-per-wound anti-elite profile the army needs.
  # Thematic: Broadsides are the canon "static fire support" option Tau takes
  # for Custodes/Terminator-heavy opponents. Tabletop-realistic since Tau
  # players usually run one in CP-size games even off-box.
  - name: "Broadside Battlesuit"
    models: 1
    M: 5
    T: 6
    W: 8
    Sv: 2
    InvSv: 5
    Ld: 7
    OC: 2
    keywords: [BATTLESUIT, VEHICLE, TAU_EMPIRE]
    abilities:
      - FOR_THE_GREATER_GOOD
    weapons:
      - name: "Twin heavy rail rifle"
        A: 2
        BS: 4
        S: 9
        AP: 4
        D: 3
        range: 60
        abilities:
          - TWIN_LINKED
          - HEAVY
      - name: "Twin smart missile system"
        A: 4
        BS: 4
        S: 5
        AP: 0
        D: 1
        range: 36
        abilities:
          - TWIN_LINKED
