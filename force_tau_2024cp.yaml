# T'au Empire 2024 Combat Patrol, 11th edition datasheets (best-effort).
# Composition: 1 Commander in Enforcer Battlesuit, 10 Fire Warriors Breachers,
# 10 Pathfinders, 1 Devilfish.
#
# Simplifications:
#   - Drones ignored (no spec in CP box count agreement).
#   - Pulse blaster treated at medium-range profile (S5 AP-1 D1). Close-range
#     S6 AP-2 profile could be enabled as a separate variant yaml.
#   - Devilfish aggregated into a single weapon line summing burst cannon +
#     seeker missiles; simplifies dice count without changing expected output
#     meaningfully.
#   - Markerlight interactions, support systems, drone-tankiness all ignored
#     per sim scope.
name: "T'au Empire 2024 CP"
units:
  - name: "Commander in Enforcer Battlesuit"
    models: 1
    T: 6
    W: 7
    Sv: 2
    InvSv: 4
    FNP: null
    weapons:
      - name: "Cyclic ion blaster"
        A: 4
        BS: 3
        S: 6
        AP: 1
        D: 2
      - name: "Battlesuit fist"
        A: 3
        WS: 4
        S: 6
        AP: 0
        D: 1
        melee: true

  - name: "Fire Warriors Breacher Team"
    models: 10
    T: 3
    W: 1
    Sv: 4
    InvSv: null
    FNP: null
    weapons:
      - name: "Pulse blaster (medium)"
        A: 2
        BS: 4
        S: 5
        AP: 1
        D: 1

  - name: "Pathfinders"
    models: 10
    T: 3
    W: 1
    Sv: 5
    InvSv: null
    FNP: null
    weapons:
      - name: "Pulse carbine"
        A: 2
        BS: 4
        S: 5
        AP: 0
        D: 1

  - name: "Devilfish"
    models: 1
    T: 9
    W: 11
    Sv: 3
    InvSv: null
    FNP: null
    weapons:
      - name: "Burst cannon + seekers (aggregated)"
        A: 6
        BS: 4
        S: 6
        AP: 1
        D: 1
